# Paper hparams for π₀.₅ SAE training (matches openpi-mech's
# SAE/train_sae/artifacts/*/layer_NN/trainer_0/config.json on the
# 50-trial libero_spatial collection):
#   k=64, dict_size = activation_dim (1x ratio), lr=1e-4,
#   steps=10000, batch_size=40000.
#
# Structural fields (data_dir, layer_idx, activation_dim, dict_size,
# submodule_name, run_tag) are filled per (capture_target, layer)
# pair via --override in the companion sbatch
# sbatch_scripts/openpi/train_sae_libero_spatial.sbatch.

k: 64
lr: 1.0e-4
steps: 10000
batch_size: 40000

wandb_project: ""
wandb_group: ""
