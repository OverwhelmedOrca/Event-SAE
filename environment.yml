name: event-sae-openvla
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - pytorch=2.2.0
  - pytorch-cuda=12.1
  - torchvision=0.17.0
  - torchaudio=2.2.0
  - ninja
  - cmake<4
  - numpy=1.26
  - pip:
      # Pin numpy<2 here too — pip resolver will otherwise upgrade past the conda pin
      - "numpy==1.26.4"

      # Core ML
      - transformers==4.48.1
      - tokenizers==0.21.2
      - accelerate
      - timm>=0.9.10,<1.0.0
      - huggingface_hub
      - safetensors
      - einops

      # SAE / activation hooks
      - nnsight==0.3.3

      # Image preprocessing for openVLA inputs (lanczos3 resize, center crop, JPEG roundtrip).
      # Used by libero_experiments/{model,libero_utils}.py; keeps inference bit-identical to the source repo.
      - tensorflow==2.16.1
      - tensorflow-datasets

# NOTE: LIBERO, dictionary_learning, and AWE are installed in a separate post-conda step.
# See README "Install external libraries" for the exact commands.

      # NOTE: LIBERO and its sim dependencies (robosuite, bddl, mujoco, gym) are
      # installed separately, see README "Install LIBERO" section:
      #   git clone https://github.com/Lifelong-Robot-Learning/LIBERO.git
      #   cd LIBERO && pip install -e .

      # Image / video IO (used by our scoring + keyframe code, independent of LIBERO)
      - imageio[ffmpeg]
      - opencv-python

      # Config + IO
      - draccus
      - pyyaml
      - tqdm

      # Stage 3: VLM annotation via Gemini
      - google-genai

      # Stage 4: scoring / clustering
      - scikit-learn
      - scipy
      - pandas
      - matplotlib

      # Optional: experiment tracking
      - wandb
